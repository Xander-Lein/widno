[package]
name = "widno"
version = "0.1.0"
edition = "2021"
description = "A fast, minimal Windows image viewer inspired by FSMaxView"
license = "MIT"

[dependencies]
anyhow = "1"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "ico", "pnm", "tga", "webp"] }
kamadak-exif = "0.6"
pdfium-render = "0.8.37"
rawloader = "0.37"
rfd = "0.15"
sevenz-rust2 = "0.24"
thiserror = "2"
unrar-rs = { version = "0.14", default-features = false, features = ["crypto-rust"] }
zip = "2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
sha2 = "0.10"
tempfile = "3"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
